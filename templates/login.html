<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BackDoor — Secure Access</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at 15% 20%, rgba(255,255,255,.055), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(255,255,255,.035), transparent 30%),
                #070809;

            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                sans-serif;

            overflow: hidden;
        }

        .ambient {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(90px);
        }

        .ambient.one {
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,.055);
            top: -140px;
            left: -100px;
        }

        .ambient.two {
            width: 350px;
            height: 350px;
            background: rgba(255,255,255,.035);
            right: -160px;
            bottom: -160px;
        }

        .login-card {
            position: relative;
            z-index: 2;

            width: 430px;
            max-width: calc(100% - 35px);

            padding: 44px;

            border-radius: 32px;

            background: rgba(24,25,27,.67);

            border: 1px solid rgba(255,255,255,.10);

            box-shadow:
                0 40px 100px rgba(0,0,0,.60),
                inset 0 1px 1px rgba(255,255,255,.07);

            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
        }

        .brand {
            text-align: center;
        }

        .brand h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 6px;
        }

        .brand p {
            margin-top: 9px;
            color: #707174;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .access-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;

            margin: 32px 0 27px;

            color: #858589;
            font-size: 10px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #aaa;
            box-shadow: 0 0 12px rgba(255,255,255,.20);
        }

        .field {
            margin-bottom: 19px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;

            color: #858589;
            font-size: 10px;
            letter-spacing: 1.2px;
        }

        .input-box {
            position: relative;
        }

        input {
            width: 100%;
            height: 55px;

            padding: 0 50px 0 17px;

            border: 1px solid rgba(255,255,255,.09);
            border-radius: 16px;

            outline: none;

            background: rgba(255,255,255,.045);

            color: #fff;
            font-size: 14px;

            transition: .2s;
        }

        input::placeholder {
            color: #505155;
        }

        input:focus {
            border-color: rgba(255,255,255,.23);
            background: rgba(255,255,255,.065);
        }

        .eye {
            position: absolute;

            right: 13px;
            top: 50%;

            transform: translateY(-50%);

            width: 30px;
            height: 30px;

            border: 0;
            background: transparent;

            color: #66686b;

            cursor: pointer;
        }

        .eye:hover {
            color: #ddd;
        }

        .eye svg {
            width: 19px;
            height: 19px;
        }

        .message {
            margin-bottom: 18px;
            padding: 12px 14px;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 13px;

            background: rgba(255,255,255,.045);

            color: #aaa;
            font-size: 12px;
            text-align: center;
        }

        .submit {
            width: 100%;
            height: 55px;

            margin-top: 3px;

            border: 0;
            border-radius: 16px;

            background: #f1f1f1;
            color: #090909;

            font-size: 13px;
            font-weight: 700;
            letter-spacing: .8px;

            cursor: pointer;

            transition: .2s;
        }

        .submit:hover {
            background: #fff;
            transform: translateY(-1px);
        }

        .signup {
            margin-top: 25px;

            text-align: center;

            color: #66686b;
            font-size: 12px;
        }

        .signup a {
            color: #d5d5d5;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 27px;

            text-align: center;

            color: #393a3d;

            font-size: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @media(max-width:500px) {
            .login-card {
                padding: 32px 24px;
            }

            .brand h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <div class="ambient one"></div>
    <div class="ambient two"></div>

    <main class="login-card">

        <div class="brand">
            <h1>BACKDOOR</h1>
            <p>Cyber Security Operations Center</p>
        </div>

        <div class="access-status">
            <span class="status-dot"></span>
            Secure Access Portal
        </div>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST" action="/login">

            <div class="field">
                <label>USERNAME</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label>PASSWORD</label>

                <div class="input-box">

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword()"
                    >
                        <svg
                            id="eyeIcon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="2.7"/>
                        </svg>
                    </button>

                </div>
            </div>

            <button class="submit" type="submit">
                ACCESS COMMAND CENTER
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="/signup">Create account</a>
        </div>

        <div class="footer">
            BackDoor Security Monitoring System
        </div>

    </main>

    <script>
        function togglePassword() {

            const input = document.getElementById("password");
            const icon = document.getElementById("eyeIcon");

            if (input.type === "password") {

                input.type = "text";

                icon.innerHTML = `
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.1 3.8"/>
                    <path d="M6.2 6.3C3.5 8 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.8-.8"/>
                `;

            } else {

                input.type = "password";

                icon.innerHTML = `
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
                    <circle cx="12" cy="12" r="2.7"/>
                `;
            }
        }
    </script>

</body>
</html>
